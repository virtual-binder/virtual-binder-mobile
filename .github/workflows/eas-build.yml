name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil de EAS Build"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate app
        run: |
          npm run lint
          npm run typecheck

      - name: Build Android with EAS
        run: eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --no-wait
